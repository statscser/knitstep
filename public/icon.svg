<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="kl-icon">
      <circle cx="50" cy="50" r="35" />
    </clipPath>
  </defs>

  <!-- Needle 1 — steep rightward lean -->
  <line x1="25" y1="8" x2="75" y2="92" stroke="#C4A882" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="25" cy="8" r="5.5" fill="#C4A882" />
  <circle cx="23" cy="6" r="2" fill="white" fill-opacity="0.4" />

  <!-- Needle 2 — shallow rightward lean -->
  <line x1="8" y1="30" x2="92" y2="70" stroke="#C4A882" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="8" cy="30" r="5.5" fill="#C4A882" />
  <circle cx="6" cy="28" r="2" fill="white" fill-opacity="0.4" />

  <!-- Yarn ball — Morandi green -->
  <circle cx="50" cy="50" r="35" fill="#A8BFA0" />

  <!-- Yarn winding texture clipped inside ball -->
  <g clip-path="url(#kl-icon)">
    <path d="M 72 16 Q 50 50 28 84" stroke="white" stroke-opacity="0.22" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 84 30 Q 65 54 46 78" stroke="white" stroke-opacity="0.15" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 60 16 Q 38 50 16 84" stroke="white" stroke-opacity="0.18" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 28 16 Q 50 50 72 84" stroke="black" stroke-opacity="0.07" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 16 30 Q 35 54 54 78" stroke="black" stroke-opacity="0.05" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 16 42 Q 50 33 84 42" stroke="white" stroke-opacity="0.18" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 15 55 Q 50 46 85 55" stroke="white" stroke-opacity="0.18" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M 18 68 Q 50 59 82 68" stroke="white" stroke-opacity="0.12" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <ellipse cx="52" cy="73" rx="30" ry="16" fill="black" fill-opacity="0.13" />
    <ellipse cx="37" cy="35" rx="15" ry="11" fill="white" fill-opacity="0.2" />
  </g>

  <!-- Needle tips on top of ball -->
  <circle cx="75" cy="92" r="3" fill="#C4A882" />
  <circle cx="92" cy="70" r="3" fill="#C4A882" />
</svg>
